<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 240" role="img" aria-label="EPCORA mark">
  <!-- C: gear arc -->
  <g fill="#074E84">
    <rect x="134" y="16" width="12" height="16" rx="2"/>
    <rect x="134" y="16" width="12" height="16" rx="2" transform="rotate(40 140 120)"/>
    <rect x="134" y="16" width="12" height="16" rx="2" transform="rotate(80 140 120)"/>
    <rect x="134" y="16" width="12" height="16" rx="2" transform="rotate(120 140 120)"/>
    <rect x="134" y="16" width="12" height="16" rx="2" transform="rotate(-40 140 120)"/>
    <rect x="134" y="16" width="12" height="16" rx="2" transform="rotate(-80 140 120)"/>
    <rect x="134" y="16" width="12" height="16" rx="2" transform="rotate(-120 140 120)"/>
  </g>
  <path d="M84.8 64.8 A78 78 0 1 1 84.8 175.2" fill="none" stroke="#074E84" stroke-width="34"/>

  <!-- E: gold, crane nod -->
