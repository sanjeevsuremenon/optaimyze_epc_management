    <rect x="22" y="58" width="62" height="22"/>
    <rect x="22" y="109" width="70" height="22"/>
    <rect x="22" y="160" width="62" height="22"/>
  </g>
  <!-- crane hook -->
  <path d="M78 80 v10 a8 8 0 1 1 -8 -8" fill="none" stroke="#05052D" stroke-width="5" stroke-linecap="round"/>

  <!-- P: saffron -->
  <rect x="92" y="58" width="24" height="124" fill="#E8730C"/>
  <path d="M116 58 h26 a32 32 0 0 1 0 64 h-26" fill="none" stroke="#E8730C" stroke-width="22"/>
