<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blue-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="24" />
  
  <!-- Dashboard Card Visual Background -->
  <g opacity="0.15">
    <circle cx="320" cy="320" r="280" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 8" />
    <circle cx="320" cy="320" r="200" fill="none" stroke="#0ea5e9" stroke-width="1" />
  </g>

  <!-- Central Illustrated Stack Icon / Dashboard Panel -->
  <g transform="translate(120, 160)">
    <!-- Main UI Mockup Panel -->
    <rect x="0" y="0" width="400" height="280" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <rect x="0" y="0" width="400" height="40" rx="16" fill="#0f172a" clip-path="inset(0 0 240 0)" />
    
    <!-- Browser window dots -->
    <circle cx="20" cy="20" r="6" fill="#ef4444" />
    <circle cx="40" cy="20" r="6" fill="#eab308" />
    <circle cx="60" cy="20" r="6" fill="#22c55e" />
    
    <!-- Chart Visuals Inside Panel -->
    <rect x="30" y="70" width="100" height="80" rx="8" fill="#0f172a" />
    <circle cx="80" cy="110" r="24" fill="none" stroke="url(#blue-glow)" stroke-width="8" stroke-dasharray="100 50" />
    
    <rect x="150" y="70" width="220" height="80" rx="8" fill="#0f172a" />
    <path d="M 170 120 L 210 95 L 250 110 L 290 85 L 330 105" fill="none" stroke="url(#cyan-glow)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Data List Rows -->
    <rect x="30" y="170" width="340" height="24" rx="4" fill="#0f172a" />
    <circle cx="50" cy="182" r="6" fill="#06b6d4" />
    <rect x="75" y="179" width="120" height="6" rx="3" fill="#475569" />
    <rect x="280" y="179" width="60" height="6" rx="3" fill="#22c55e" />

    <rect x="30" y="205" width="340" height="24" rx="4" fill="#0f172a" />
    <circle cx="50" cy="217" r="6" fill="#3b82f6" />
    <rect x="75" y="214" width="160" height="6" rx="3" fill="#475569" />
    <rect x="280" y="214" width="60" height="6" rx="3" fill="#eab308" />
  </g>
  
  <!-- Overlay Glowing Icon representing Materials / Logistics Stack -->
  <g transform="translate(420, 360)">
    <rect x="-10" y="-10" width="80" height="80" rx="16" fill="url(#cyan-glow)" opacity="0.2" filter="blur(8px)" />
    <rect x="0" y="0" width="60" height="60" rx="12" fill="url(#cyan-glow)" />
    <!-- Forklift or Box lines -->
    <path d="M 18 18 L 42 18 L 42 42 L 18 42 Z" fill="none" stroke="#ffffff" stroke-width="3" />
    <path d="M 18 30 L 42 30" fill="none" stroke="#ffffff" stroke-width="2" />
  </g>
</svg>
